[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "djangorestframework"
description = "Web APIs for Django, made easy."
readme = "README.md"
license = "BSD-3-Clause"
license-files = [ "LICENSE.md" ]
authors = [ { name = "Tom Christie", email = "tom@tomchristie.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]
dynamic = [ "version" ]
dependencies = [ "django>=5.2" ]
urls.Changelog = "https://www.django-rest-framework.org/community/release-notes/"
urls.Funding = "https://fund.django-rest-framework.org/topics/funding/"
urls.Homepage = "https://www.django-rest-framework.org"
urls.Source = "https://github.com/encode/django-rest-framework"

[dependency-groups]
dev = [
  { include-group = "docs" },
  { include-group = "optional" },
  { include-group = "test" },
]
test = [
  "dj-database-url>=3.1.0",
  "importlib-metadata<10.0",
  # Pytest for running the tests.
  "pytest==9.*",
  "pytest-cov==7.*",
  "pytest-django>=4.5.2,<5",
]
docs = [
  # MkDocs to build our documentation.
  "mkdocs==1.6.1",
  "mkdocs-material[imaging]==9.7.7",
  # MkDocs Redirects to add redirects to documentation
  "mkdocs-redirects==1.2.3",
  # pylinkvalidator to check for broken links in documentation.
  "pylinkvalidator==0.3",
]
django52 = [ "django>=5.2,<6.0" ]
django60 = [ "django>=6.0,<6.1" ]
django61 = [ "django>=6.1,<6.2" ]
djangomain = [ "django @ https://github.com/django/django/archive/main.tar.gz" ]
optional = [
  # Optional packages which may be used with REST framework.
  "django-filter",
  "django-guardian>=2.4.0,<3.6",
  "inflection==0.5.1",
  "legacy-cgi; python_version>='3.13'",
  "markdown>=3.3.7",
  "psycopg[binary]>=3.1.8",
  "pygments==2.21.*",
  "pyyaml>=5.3.1,<6.1",
  "requests",
  "uritemplate",
]

[tool.setuptools]
packages.find.include = [ "rest_framework*" ]
package-data.rest_framework = [
  "locale/**/*.mo",
  "static/**/*",
  "templates/**/*",
]
dynamic.version = { attr = "rest_framework.__version__" }

[tool.isort]
atomic = true
multi_line_output = 5
extra_standard_library = [ "types" ]
known_third_party = [ "_pytest", "django", "pytest", "uritemplate" ]
known_first_party = [ "rest_framework", "tests" ]
skip = [ ".tox" ]

[tool.flake8]
extend-ignore = [ "E501", "W503", "W504", "B" ]
extend-select = [ "B006" ]
banned-modules = "json = use from rest_framework.utils import json!"

[tool.codespell]
builtin = "clear,rare,code,names,en-GB_to_en-US"
ignore-words = "codespell-ignore-words.txt"
ignore-words-list = "commitish"
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = "*/kickstarter-announcement.md,*.js,*.map,*.po,*.css,locale"

[tool.pyproject-fmt]
keep_full_version = true
max_supported_python = "3.14"

[tool.pytest]
addopts = [
  "--tb=short",
  "--strict-markers",
  "-ra",
  "--no-migrations",
]
filterwarnings = [
  "ignore:'cgi' is deprecated:DeprecationWarning",
]
markers = [
  "requires_postgres: marks tests as requiring a PostgreSQL database backend",
]
testpaths = [ "tests" ]

[tool.coverage]
# NOTE: source is ignored with pytest-cov (but uses the same).
run.source = [ "." ]
run.include = [ "rest_framework/*", "tests/*" ]
run.branch = true
report.include = [ "rest_framework/*", "tests/*" ]
report.exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
]
