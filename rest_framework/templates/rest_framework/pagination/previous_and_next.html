<ul class="pagination pager">
  {% if previous_url %}
    <li class="page-item previous">
      <a class="page-link" href="{{ previous_url }}" rel="prev" aria-label="Previous page">&laquo; Previous</a>
    </li>
  {% else %}
    <li class="page-item previous disabled" aria-disabled="true">
      <a class="page-link" href="#" tabindex="-1" aria-disabled="true">&laquo; Previous</a>
    </li>
  {% endif %}

  {% if next_url %}
    <li class="page-item next">
      <a class="page-link" href="{{ next_url }}" rel="next" aria-label="Next page">Next &raquo;</a>
    </li>
  {% else %}
    <li class="page-item next disabled" aria-disabled="true">
      <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Next &raquo;</a>
    </li>
  {% endif %}
</ul>
