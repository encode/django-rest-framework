{% load rest_framework %}
<fieldset>
  {% if field.label %}
    <div class="form-group row mb-3 border-bottom">
      <legend class="col-form-label col-sm-2 fs-4{% if style.hide_label %} visually-hidden{% endif %}">
        {{ field.label }}
      </legend>
    </div>
  {% endif %}

  {% for nested_field in field %}
    {% if not nested_field.read_only %}
      {% render_field nested_field style=style %}
    {% endif %}
  {% endfor %}
</fieldset>
