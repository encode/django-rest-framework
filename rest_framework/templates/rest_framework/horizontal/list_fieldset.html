{% load rest_framework %}

<fieldset>
  {% if field.label %}
    <div class="form-group row mb-3 border-bottom">
      <legend class="col-form-label col-sm-2 fs-4{% if style.hide_label %} visually-hidden{% endif %}">
        {{ field.label }}
      </legend>
    </div>
  {% endif %}

  <p>Lists are not currently supported in HTML input.</p>
</fieldset>
