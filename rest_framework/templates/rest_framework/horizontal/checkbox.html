<div class="form-group row mb-3 horizontal-checkbox{% if field.errors %} has-error{% endif %}">
  {% if field.label %}
    <label class="col-sm-2 col-form-label{% if style.hide_label %} visually-hidden{% endif %}">
      {{ field.label }}
    </label>
  {% endif %}

  <div class="col-sm-10">
    <div class="form-check">
      <input class="form-check-input{% if field.errors %} is-invalid{% endif %}" type="checkbox" name="{{ field.name }}" value="true" {% if field.value %}checked{% endif %}>
    </div>

    {% if field.errors %}
      {% for error in field.errors %}
        <div class="invalid-feedback d-block">{{ error }}</div>
      {% endfor %}
    {% endif %}

    {% if field.help_text %}
      <div class="form-text">{{ field.help_text|safe }}</div>
    {% endif %}
  </div>
</div>
