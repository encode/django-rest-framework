{% load rest_framework %}
<div class="form-group {% if field.errors %}has-error{% endif %}">
  {% if field.label %}
  <label {% if style.hide_label %}class="sr-only" {% endif %}>
    {{ field.label }}
  </label>
  {% endif %}

  <select class="form-control" name="{{ field.name }}">
    {% for select in field.iter_options %} {% if select.value|as_string == field.value|as_string %}
    <option value="{{ select.value }}" selected>
      {{ select.display_text }}
    </option>
    {% else %}
    <option value="{{ select.value }}">{{ select.display_text }}</option>
    {% endif %} {% endfor %}
  </select>

  {% if field.errors %} {% for error in field.errors %}
  <span class="help-block">{{ error }}</span>
  {% endfor %} {% endif %} {% if field.help_text %}
  <span class="help-block">{{ field.help_text|safe }}</span>
  {% endif %}
</div>
