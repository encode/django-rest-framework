{% load rest_framework %}
{% load i18n %}
<h2>{% trans "Ordering" %}</h2>
<div class="list-group">
    {% for key, label in options %}
        {% if key == current %}
            <a href="{% add_query_param request param key %}" class="list-group-item list-group-item-action active" aria-current="true">
                <span class="float-end">{% include "rest_framework/icons/check-lg.html" %}</span> {{ label }}
            </a>
        {% else %}
            <a href="{% add_query_param request param key %}" class="list-group-item list-group-item-action">{{ label }}</a>
        {% endif %}
    {% endfor %}
</div>
